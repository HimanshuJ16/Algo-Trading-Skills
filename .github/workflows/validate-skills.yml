name: Validate & Test Skills

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate skill structure, frontmatter, cross-references and packaging
        run: python tools/validate_skills.py

      - name: Validate against the agentskills.io reference validator
        run: |
          for d in skills/*/; do skills-ref validate "$d" || exit 1; done

      - name: Check generated files are current (index.json, marketplace.json)
        run: |
          python tools/build_index.py --check
          python tools/build_marketplace.py --check

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Run every skill's unit test suite
        run: python tools/run_all_tests.py --quiet --timeout 120

      - name: Run the cookbook examples
        run: |
          for f in examples/*.py; do python "$f" > /dev/null || exit 1; done
