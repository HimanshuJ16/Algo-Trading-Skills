name: Validate & Test Skills

on:
  push:
    paths:
      - "skills/**"
      - "index.json"
      - "tools/**"
      - "requirements*.txt"
  pull_request:
    paths:
      - "skills/**"
      - "index.json"
      - "tools/**"
      - "requirements*.txt"

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate skill structure and frontmatter
        run: python tools/validate_skills.py

      - name: Run complete unit test suite across all 504 skills
        run: python tools/run_all_tests.py

