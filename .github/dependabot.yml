# Keeps the GitHub Actions used by CI current. Python dependencies are deliberately not
# tracked: requirements-dev.txt pins minimum versions rather than exact ones, so a floor
# bump adds nothing and can drop an interpreter the library still supports (pandas 3.x
# requires Python 3.11+, while this library runs on 3.10).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
